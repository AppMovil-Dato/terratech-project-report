<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow4)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="20" font-weight="700">TerraTech — C4 System Context Diagram (Nivel 1)</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">Diagrama de Contexto del Sistema: Usuarios principales, Sistema TerraTech y Servicios Externos</text>

  <!-- Person 1: Agricultor -->
  <g transform="translate(80, 160)">
    <rect width="220" height="150" rx="10" fill="#08427b" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow4)"/>
    <circle cx="110" cy="35" r="18" fill="#38bdf8"/>
    <text x="110" y="42" fill="#08427b" font-size="14" font-weight="bold" text-anchor="middle">👤</text>
    <text x="110" y="75" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Agricultor</text>
    <text x="110" y="93" fill="#93c5fd" font-size="11" text-anchor="middle">[Person - Usuario]</text>
    <text x="110" y="115" fill="#e0f2fe" font-size="10" text-anchor="middle">Gestiona parcelas y monitoreo,</text>
    <text x="110" y="130" fill="#e0f2fe" font-size="10" text-anchor="middle">recibe alertas y consulta recomendaciones.</text>
  </g>

  <!-- Person 2: Ingeniero Agrónomo -->
  <g transform="translate(80, 420)">
    <rect width="220" height="150" rx="10" fill="#08427b" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow4)"/>
    <circle cx="110" cy="35" r="18" fill="#38bdf8"/>
    <text x="110" y="42" fill="#08427b" font-size="14" font-weight="bold" text-anchor="middle">🔬</text>
    <text x="110" y="75" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Ing. Agrónomo</text>
    <text x="110" y="93" fill="#93c5fd" font-size="11" text-anchor="middle">[Person - Especialista]</text>
    <text x="110" y="115" fill="#e0f2fe" font-size="10" text-anchor="middle">Analiza reportes de cultivo y</text>
    <text x="110" y="130" fill="#e0f2fe" font-size="10" text-anchor="middle">brinda asesoría técnica en la comunidad.</text>
  </g>

  <!-- System Node: TerraTech -->
  <g transform="translate(450, 240)">
    <rect width="320" height="230" rx="14" fill="#1168bd" stroke="#60a5fa" stroke-width="3" filter="url(#shadow4)"/>
    <text x="160" y="45" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">TerraTech Solution</text>
    <text x="160" y="68" fill="#bfdbfe" font-size="12" font-weight="bold" text-anchor="middle">[Software System]</text>
    <text x="160" y="105" fill="#ffffff" font-size="12" text-anchor="middle">Plataforma móvil integral para el</text>
    <text x="160" y="125" fill="#ffffff" font-size="12" text-anchor="middle">monitoreo inteligente de cultivos,</text>
    <text x="160" y="145" fill="#ffffff" font-size="12" text-anchor="middle">análisis preventivo y apoyo a decisiones,</text>
    <text x="160" y="165" fill="#ffffff" font-size="12" text-anchor="middle">alertas meteorológicas y colaboración.</text>
    <rect x="40" y="185" width="240" height="28" rx="6" fill="#08427b"/>
    <text x="160" y="203" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">Android Native + ASP.NET Core Backend</text>
  </g>

  <!-- External System 1: OpenWeatherMap -->
  <g transform="translate(900, 160)">
    <rect width="220" height="150" rx="10" fill="#334155" stroke="#64748b" stroke-width="2" filter="url(#shadow4)"/>
    <text x="110" y="45" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">OpenWeatherMap</text>
    <text x="110" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">[External SaaS System]</text>
    <text x="110" y="105" fill="#e2e8f0" font-size="10" text-anchor="middle">API meteorológica externa que</text>
    <text x="110" y="120" fill="#e2e8f0" font-size="10" text-anchor="middle">provee pronósticos de 7 días,</text>
    <text x="110" y="135" fill="#e2e8f0" font-size="10" text-anchor="middle">temperatura y riesgo de helada.</text>
  </g>

  <!-- External System 2: Firebase FCM -->
  <g transform="translate(900, 420)">
    <rect width="220" height="150" rx="10" fill="#334155" stroke="#64748b" stroke-width="2" filter="url(#shadow4)"/>
    <text x="110" y="45" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Firebase FCM</text>
    <text x="110" y="68" fill="#cbd5e1" font-size="11" text-anchor="middle">[External Cloud Service]</text>
    <text x="110" y="105" fill="#e2e8f0" font-size="10" text-anchor="middle">Servicio en la nube de Google</text>
    <text x="110" y="120" fill="#e2e8f0" font-size="10" text-anchor="middle">para el envío de notificaciones push</text>
    <text x="110" y="135" fill="#e2e8f0" font-size="10" text-anchor="middle">al dispositivo móvil del usuario.</text>
  </g>

  <!-- Connections -->
  <!-- Agricultor -> TerraTech -->
  <path d="M 300 235 L 450 310" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="365" y="260" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Usa app [HTTPS]</text>

  <!-- Agrónomo -> TerraTech -->
  <path d="M 300 495 L 450 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="365" y="470" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Asesoría [HTTPS]</text>

  <!-- TerraTech -> Weather API -->
  <path d="M 770 310 L 900 235" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="845" y="260" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Consulta clima [JSON/REST]</text>

  <!-- TerraTech -> FCM -->
  <path d="M 770 410 L 900 495" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="845" y="470" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Envía push [FCM]</text>
</svg>

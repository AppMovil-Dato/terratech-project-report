<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="20" font-weight="700">TerraTech — Strategic Context Map</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">Mapeo Estratégico de Contextos Delimitados (Bounded Contexts) y Patrones de Relación DDD</text>

  <!-- Center Core: Field & Parcel Management -->
  <g transform="translate(440, 140)">
    <rect width="320" height="150" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="3" filter="url(#shadow3)"/>
    <rect x="15" y="15" width="120" height="24" rx="4" fill="#0284c7"/>
    <text x="75" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CORE DOMAIN</text>
    <text x="15" y="65" fill="#f8fafc" font-size="16" font-weight="bold">Field &amp; Parcel Management</text>
    <text x="15" y="88" fill="#94a3b8" font-size="12">Gestión de parcelas, geo-coordenadas,</text>
    <text x="15" y="106" fill="#94a3b8" font-size="12">cultivos asignados e inspecciones de suelo.</text>
    <text x="15" y="130" fill="#38bdf8" font-size="11" font-weight="bold">Agregados: Parcel, SoilInspection</text>
  </g>

  <!-- Core: Crop Analytics & Reporting -->
  <g transform="translate(440, 400)">
    <rect width="320" height="150" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#shadow3)"/>
    <rect x="15" y="15" width="120" height="24" rx="4" fill="#10b981"/>
    <text x="75" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CORE DOMAIN</text>
    <text x="15" y="65" fill="#f8fafc" font-size="16" font-weight="bold">Crop Analytics &amp; Reporting</text>
    <text x="15" y="88" fill="#94a3b8" font-size="12">Diagnóstico agronómico, score de salud,</text>
    <text x="15" y="106" fill="#94a3b8" font-size="12">necesidades hídricas y fertilización.</text>
    <text x="15" y="130" fill="#34d399" font-size="11" font-weight="bold">Agregados: CropHealthReport, AgronomicRule</text>
  </g>

  <!-- Generic: IAM -->
  <g transform="translate(50, 240)">
    <rect width="280" height="150" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2.5" filter="url(#shadow3)"/>
    <rect x="15" y="15" width="130" height="24" rx="4" fill="#475569"/>
    <text x="80" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">GENERIC DOMAIN</text>
    <text x="15" y="65" fill="#f8fafc" font-size="16" font-weight="bold">IAM &amp; Security</text>
    <text x="15" y="88" fill="#94a3b8" font-size="12">Autenticación JWT, control de acceso,</text>
    <text x="15" y="106" fill="#94a3b8" font-size="12">roles (Agricultor / Agrónomo) y perfil.</text>
    <text x="15" y="130" fill="#94a3b8" font-size="11" font-weight="bold">Agregados: UserAccount, Role, Session</text>
  </g>

  <!-- Supporting: Alerts & Notifications -->
  <g transform="translate(870, 140)">
    <rect width="290" height="150" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2.5" filter="url(#shadow3)"/>
    <rect x="15" y="15" width="150" height="24" rx="4" fill="#ea580c"/>
    <text x="90" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">SUPPORTING DOMAIN</text>
    <text x="15" y="65" fill="#f8fafc" font-size="16" font-weight="bold">Alerts &amp; Notifications</text>
    <text x="15" y="88" fill="#94a3b8" font-size="12">Monitoreo de umbrales críticos,</text>
    <text x="15" y="106" fill="#94a3b8" font-size="12">disparo push (FCM) y bandeja de alertas.</text>
    <text x="15" y="130" fill="#fb923c" font-size="11" font-weight="bold">Agregados: AlertNotification, ThresholdPolicy</text>
  </g>

  <!-- Supporting: Farmer Community & Collaboration -->
  <g transform="translate(870, 400)">
    <rect width="290" height="150" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" filter="url(#shadow3)"/>
    <rect x="15" y="15" width="150" height="24" rx="4" fill="#9333ea"/>
    <text x="90" y="31" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">SUPPORTING DOMAIN</text>
    <text x="15" y="65" fill="#f8fafc" font-size="16" font-weight="bold">Community &amp; Forum</text>
    <text x="15" y="88" fill="#94a3b8" font-size="12">Foro comunitario, consultas técnicas,</text>
    <text x="15" y="106" fill="#94a3b8" font-size="12">respuestas de agrónomos y reputación.</text>
    <text x="15" y="130" fill="#c084fc" font-size="11" font-weight="bold">Agregados: ForumPost, ExpertAnswer, Rating</text>
  </g>

  <!-- External Systems -->
  <g transform="translate(440, 620)">
    <rect width="320" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="160" y="35" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">☁️ SERVICIOS EXTERNOS (SaaS)</text>
    <text x="160" y="58" fill="#f8fafc" font-size="12" text-anchor="middle">OpenWeatherMap API &amp; Firebase Cloud Messaging</text>
  </g>

  <!-- Relationships and Connectors -->
  <!-- IAM (U) -> Field & Parcel (D) [Customer/Supplier] -->
  <path d="M 330 290 L 440 230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="345" y="235" width="80" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="385" y="250" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">U [IAM] / D [CF]</text>

  <!-- IAM (U) -> Community (D) -->
  <path d="M 330 350 L 870 450" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="480" y="375" width="130" height="20" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="545" y="389" fill="#94a3b8" font-size="9" text-anchor="middle">U [IAM] / D [Conformist]</text>

  <!-- Field & Parcel (U) -> Crop Analytics (D) [Customer / Supplier + ACL] -->
  <path d="M 600 290 L 600 400" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <rect x="535" y="330" width="130" height="26" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="600" y="347" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">U / D [Customer-Supplier]</text>

  <!-- Crop Analytics (U) -> Alerts & Notifications (D) -->
  <path d="M 760 430 L 870 250" stroke="#f97316" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="780" y="315" width="120" height="24" rx="4" fill="#0f172a" stroke="#f97316"/>
  <text x="840" y="331" fill="#fb923c" font-size="10" font-weight="bold" text-anchor="middle">Domain Events (Pub/Sub)</text>

  <!-- External Weather -> Crop Analytics [ACL] -->
  <path d="M 600 620 L 600 550" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="545" y="570" width="110" height="24" rx="4" fill="#0f172a" stroke="#f59e0b"/>
  <text x="600" y="586" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">ACL (Anti-Corruption)</text>
</svg>

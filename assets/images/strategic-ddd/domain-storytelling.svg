<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- Title -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="20" font-weight="700">TerraTech — Domain Storytelling: Flujo de Monitoreo Preventivo y Alertas</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">Historia de Dominio: Registro de Inspección de Suelo, Consulta Climática Externa, Diagnóstico Agronómico y Notificación Push</text>

  <!-- Actors and Systems Nodes -->
  <!-- Actor 1: Agricultor -->
  <g transform="translate(60, 160)">
    <circle cx="50" cy="50" r="40" fill="#0284c7" filter="url(#shadow2)"/>
    <text x="50" y="45" fill="#ffffff" font-size="24" text-anchor="middle">👨‍🌾</text>
    <text x="50" y="65" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Agricultor</text>
    <text x="50" y="110" fill="#94a3b8" font-size="11" text-anchor="middle">(Usuario Móvil)</text>
  </g>

  <!-- Node 2: TerraTech Android App -->
  <g transform="translate(260, 150)">
    <rect width="180" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow2)"/>
    <text x="90" y="35" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">📱 TerraTech App</text>
    <text x="90" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Cliente Móvil Android</text>
    <text x="90" y="75" fill="#94a3b8" font-size="10" text-anchor="middle">(Kotlin + Jetpack + Room)</text>
  </g>

  <!-- Node 3: Backend REST API -->
  <g transform="translate(560, 150)">
    <rect width="200" height="100" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow2)"/>
    <text x="100" y="35" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">⚙️ Backend Services</text>
    <text x="100" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Spring Boot API REST</text>
    <text x="100" y="75" fill="#94a3b8" font-size="10" text-anchor="middle">(Bounded Contexts Cores)</text>
  </g>

  <!-- Node 4: OpenWeatherMap API -->
  <g transform="translate(900, 150)">
    <rect width="180" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
    <text x="90" y="35" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">☁️ OpenWeatherMap</text>
    <text x="90" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Servicio Externo</text>
    <text x="90" y="75" fill="#94a3b8" font-size="10" text-anchor="middle">(Pronósticos y Telemetría)</text>
  </g>

  <!-- Node 5: Agronomist -->
  <g transform="translate(60, 480)">
    <circle cx="50" cy="50" r="40" fill="#16a34a" filter="url(#shadow2)"/>
    <text x="50" y="45" fill="#ffffff" font-size="24" text-anchor="middle">🔬</text>
    <text x="50" y="65" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Agrónomo</text>
    <text x="50" y="110" fill="#94a3b8" font-size="11" text-anchor="middle">(Asesor Técnico)</text>
  </g>

  <!-- Node 6: Firebase Cloud Messaging -->
  <g transform="translate(560, 480)">
    <rect width="200" height="100" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2" filter="url(#shadow2)"/>
    <text x="100" y="35" fill="#f97316" font-size="13" font-weight="bold" text-anchor="middle">🔥 Firebase FCM</text>
    <text x="100" y="55" fill="#f8fafc" font-size="11" text-anchor="middle">Gateway de Notificaciones</text>
    <text x="100" y="75" fill="#94a3b8" font-size="10" text-anchor="middle">(Push Notifications Service)</text>
  </g>

  <!-- Numbered Step Arrows -->
  <!-- Step 1: Agricultor -> App -->
  <path d="M 150 200 L 255 200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <circle cx="200" cy="185" r="13" fill="#38bdf8"/>
  <text x="200" y="189" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="200" y="225" fill="#bae6fd" font-size="10" font-weight="bold" text-anchor="middle">Registra datos suelo</text>

  <!-- Step 2: App -> Backend -->
  <path d="M 445 200 L 555 200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <circle cx="500" cy="185" r="13" fill="#38bdf8"/>
  <text x="500" y="189" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="500" y="225" fill="#bae6fd" font-size="10" font-weight="bold" text-anchor="middle">Sincroniza inspección</text>

  <!-- Step 3: Backend -> Weather API -->
  <path d="M 765 190 L 895 190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <circle cx="830" cy="175" r="13" fill="#38bdf8"/>
  <text x="830" y="179" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="830" y="160" fill="#bae6fd" font-size="10" font-weight="bold" text-anchor="middle">Consulta clima / pronóstico</text>

  <!-- Step 4: Weather API -> Backend -->
  <path d="M 895 220 L 765 220" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <circle cx="830" cy="235" r="13" fill="#f59e0b"/>
  <text x="830" y="239" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="830" y="260" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">Retorna datos térmicos</text>

  <!-- Step 5: Backend Evaluates & Triggers Alert -->
  <path d="M 660 255 L 660 475" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-warn)"/>
  <circle cx="678" cy="360" r="13" fill="#f97316"/>
  <text x="678" y="364" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">5</text>
  <text x="760" y="355" fill="#fed7aa" font-size="10" font-weight="bold">Genera reporte y</text>
  <text x="760" y="370" fill="#fed7aa" font-size="10" font-weight="bold">detecta riesgo helada</text>

  <!-- Step 6: FCM -> App Push -->
  <path d="M 555 530 L 350 530 L 350 255" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrow-warn)" fill="none"/>
  <circle cx="350" cy="400" r="13" fill="#f97316"/>
  <text x="350" y="404" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">6</text>
  <text x="250" y="400" fill="#fed7aa" font-size="10" font-weight="bold">Envía Alerta Push</text>
  <text x="250" y="415" fill="#fed7aa" font-size="9">al celular del agricultor</text>

  <!-- Step 7: Agronomist interacts with Community -->
  <path d="M 150 530 L 260 530 L 260 255" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow2)" fill="none"/>
  <circle cx="205" cy="515" r="13" fill="#16a34a"/>
  <text x="205" y="519" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">7</text>
  <text x="205" y="555" fill="#bbf7d0" font-size="10" font-weight="bold" text-anchor="middle">Responde consulta en foro</text>
</svg>

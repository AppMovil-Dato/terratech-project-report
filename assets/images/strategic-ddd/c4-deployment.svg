<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Header -->
  <rect x="30" y="25" width="1140" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow6)"/>
  <text x="60" y="58" fill="#f8fafc" font-size="20" font-weight="700">TerraTech — C4 Deployment Diagram (Nivel 3)</text>
  <text x="60" y="80" fill="#94a3b8" font-size="13">Diagrama de Despliegue de Infraestructura Física / Cloud: Dispositivos Móviles, Servidor Cloud y Servicios SaaS</text>

  <!-- Node 1: Dispositivo Móvil del Agricultor -->
  <g transform="translate(40, 130)">
    <rect width="360" height="680" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow6)"/>
    <rect x="15" y="15" width="220" height="26" rx="6" fill="#0369a1"/>
    <text x="125" y="32" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">📱 Android Smartphone Device</text>
    <text x="20" y="65" fill="#94a3b8" font-size="11">OS: Android 11.0+ (API 30+)</text>
    <text x="20" y="82" fill="#94a3b8" font-size="11">Hardware: GPS, Cámara, Almacenamiento Flash</text>

    <!-- Artifact: APK / Native App Container -->
    <g transform="translate(20, 105)">
      <rect width="320" height="260" rx="10" fill="#438dd5" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="160" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">TerraTech Android APK / AAB</text>
      <text x="160" y="50" fill="#dbeafe" font-size="11" text-anchor="middle">[Kotlin Native Artifact]</text>
      
      <!-- Sub-blocks -->
      <rect x="15" y="70" width="290" height="50" rx="6" fill="#1d4ed8"/>
      <text x="160" y="92" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Jetpack Compose UI &amp; Navigation</text>
      <text x="160" y="108" fill="#bfdbfe" font-size="9" text-anchor="middle">MVVM + StateFlow + Material 3 Design</text>

      <rect x="15" y="130" width="290" height="50" rx="6" fill="#1d4ed8"/>
      <text x="160" y="152" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Hardware Drivers &amp; Location Client</text>
      <text x="160" y="168" fill="#bfdbfe" font-size="9" text-anchor="middle">FusedLocationProviderClient + CameraX</text>

      <rect x="15" y="190" width="290" height="55" rx="6" fill="#1d4ed8"/>
      <text x="160" y="212" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Retrofit REST Client + Coroutines</text>
      <text x="160" y="230" fill="#bfdbfe" font-size="9" text-anchor="middle">OkHttp + Interceptores de Autenticación Bearer</text>
    </g>

    <!-- Artifact: Local SQLite Database -->
    <g transform="translate(20, 390)">
      <rect width="320" height="150" rx="10" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="160" y="30" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Room Database (SQLite File)</text>
      <text x="160" y="48" fill="#93c5fd" font-size="10" text-anchor="middle">[Almacenamiento Local Cifrado]</text>
      <text x="15" y="75" fill="#ffffff" font-size="10">• offline_parcels (Lotes y geometrías)</text>
      <text x="15" y="95" fill="#ffffff" font-size="10">• offline_inspections (Muestras de suelo)</text>
      <text x="15" y="115" fill="#ffffff" font-size="10">• cached_reports (Reportes agronómicos)</text>
      <text x="15" y="135" fill="#ffffff" font-size="10">• pending_sync_queue (Cola de reintento)</text>
    </g>

    <!-- Artifact: Firebase Messaging Client -->
    <g transform="translate(20, 560)">
      <rect width="320" height="90" rx="10" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
      <text x="160" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">FirebaseMessagingService Client</text>
      <text x="160" y="50" fill="#ccfbf1" font-size="10" text-anchor="middle">[Background Push Receiver]</text>
      <text x="160" y="72" fill="#e6fffa" font-size="9" text-anchor="middle">Procesa notificaciones en primer y segundo plano</text>
    </g>
  </g>

  <!-- Node 2: Cloud Infrastructure (AWS / GCP) -->
  <g transform="translate(440, 130)">
    <rect width="420" height="680" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow6)"/>
    <rect x="15" y="15" width="240" height="26" rx="6" fill="#4338ca"/>
    <text x="135" y="32" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">☁️ Cloud Infrastructure (AWS / GCP)</text>
    <text x="20" y="65" fill="#94a3b8" font-size="11">Region: us-east-1 (N. Virginia)</text>
    <text x="20" y="82" fill="#94a3b8" font-size="11">Security: TLS 1.3 / VPC / Reverse Proxy HTTPS</text>

    <!-- Sub-node: Docker Container (App Service) -->
    <g transform="translate(20, 105)">
      <rect width="380" height="280" rx="10" fill="#438dd5" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="190" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Docker Container: Spring Boot API</text>
      <text x="190" y="50" fill="#dbeafe" font-size="11" text-anchor="middle">[OpenJDK 21 Alpine Linux]</text>
      
      <rect x="15" y="70" width="350" height="55" rx="6" fill="#1d4ed8"/>
      <text x="190" y="92" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">REST Controllers (OpenAPI / Swagger 3.0)</text>
      <text x="190" y="110" fill="#bfdbfe" font-size="9" text-anchor="middle">Endpoints HTTP: /api/v1/iam, /api/v1/parcels, /api/v1/analytics</text>

      <rect x="15" y="135" width="350" height="55" rx="6" fill="#1d4ed8"/>
      <text x="190" y="157" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Domain &amp; Application Services</text>
      <text x="190" y="175" fill="#bfdbfe" font-size="9" text-anchor="middle">Lógica de evaluación agronómica, semver, políticas de alerta</text>

      <rect x="15" y="200" width="350" height="65" rx="6" fill="#1d4ed8"/>
      <text x="190" y="222" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Infrastructure Adapters &amp; Schedulers</text>
      <text x="190" y="238" fill="#bfdbfe" font-size="9" text-anchor="middle">WeatherServiceAdapter, FcmPushNotificationAdapter,</text>
      <text x="190" y="252" fill="#bfdbfe" font-size="9" text-anchor="middle">Spring @Scheduled Tasks (monitoreo periódico de heladas)</text>
    </g>

    <!-- Sub-node: Managed PostgreSQL Instance -->
    <g transform="translate(20, 420)">
      <rect width="380" height="230" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="190" y="30" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Managed Relational DB Instance</text>
      <text x="190" y="50" fill="#bfdbfe" font-size="11" text-anchor="middle">[Cloud SQL / AWS RDS PostgreSQL 16]</text>
      <text x="15" y="85" fill="#ffffff" font-size="11">• Almacenamiento persistente SSD NVMe con cifrado AES-256</text>
      <text x="15" y="108" fill="#ffffff" font-size="11">• Schemas por contexto: iam_db, parcel_db, analytics_db,</text>
      <text x="15" y="125" fill="#ffffff" font-size="11">  notification_db, community_db</text>
      <text x="15" y="150" fill="#ffffff" font-size="11">• Copias de seguridad automáticas diarias</text>
      <text x="15" y="175" fill="#ffffff" font-size="11">• Conexión segura mediante HikariCP Connection Pool</text>
    </g>
  </g>

  <!-- Node 3: External SaaS Providers -->
  <g transform="translate(900, 130)">
    <rect width="260" height="680" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow6)"/>
    <rect x="15" y="15" width="200" height="26" rx="6" fill="#334155"/>
    <text x="115" y="32" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">☁️ External SaaS Services</text>

    <!-- OpenWeatherMap -->
    <g transform="translate(15, 80)">
      <rect width="230" height="180" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="115" y="35" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="middle">OpenWeatherMap API</text>
      <text x="15" y="70" fill="#94a3b8" font-size="10">• REST API sobre HTTPS</text>
      <text x="15" y="90" fill="#94a3b8" font-size="10">• Geo-queries por lat/long</text>
      <text x="15" y="110" fill="#94a3b8" font-size="10">• Retorna temperatura min/max,</text>
      <text x="15" y="125" fill="#94a3b8" font-size="10">  probabilidad de helada y lluvia</text>
    </g>

    <!-- Firebase -->
    <g transform="translate(15, 300)">
      <rect width="230" height="180" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
      <text x="115" y="35" fill="#f97316" font-size="14" font-weight="bold" text-anchor="middle">Firebase Cloud Messaging</text>
      <text x="15" y="70" fill="#94a3b8" font-size="10">• Infraestructura Google Push</text>
      <text x="15" y="90" fill="#94a3b8" font-size="10">• Protocolo HTTP v1 API</text>
      <text x="15" y="110" fill="#94a3b8" font-size="10">• Tokens de registro por celular</text>
      <text x="15" y="130" fill="#94a3b8" font-size="10">• Entrega garantizada de alertas</text>
    </g>
  </g>

  <!-- Network Connectors -->
  <!-- Mobile -> Cloud API -->
  <path d="M 400 240 L 460 240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="430" y="230" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">HTTPS 443</text>

  <!-- Cloud API -> RDS -->
  <path d="M 630 385 L 630 420" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="630" y="405" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">Port 5432</text>

  <!-- Cloud API -> Weather -->
  <path d="M 840 220 L 915 220" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow6)"/>
  <text x="875" y="210" fill="#fde68a" font-size="8" font-weight="bold" text-anchor="middle">HTTPS REST</text>

  <!-- Cloud API -> Firebase -->
  <path d="M 840 350 L 915 350" stroke="#f97316" stroke-width="2" marker-end="url(#arrow6)"/>
  <text x="875" y="340" fill="#fed7aa" font-size="8" font-weight="bold" text-anchor="middle">HTTPS FCM</text>

  <!-- Firebase -> Mobile Client -->
  <path d="M 915 450 L 880 450 L 880 750 L 340 750 L 340 650" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow6)" fill="none"/>
  <text x="610" y="740" fill="#fed7aa" font-size="9" font-weight="bold" text-anchor="middle">Canal Seguro Google Play Services Push Notification</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="25" width="1340" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="60" fill="#f8fafc" font-size="22" font-weight="700">TerraTech — Big Picture EventStorming</text>
  <text x="60" y="82" fill="#94a3b8" font-size="13">Exploración global del dominio agrícola: Monitoreo de cultivos, telemetría de suelo, análisis agronómico y comunidad</text>

  <!-- Legend -->
  <g transform="translate(750, 45)">
    <rect x="0" y="0" width="100" height="28" rx="4" fill="#f97316" filter="url(#shadow)"/><text x="50" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Domain Event</text>
    <rect x="110" y="0" width="100" height="28" rx="4" fill="#0284c7" filter="url(#shadow)"/><text x="160" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Command</text>
    <rect x="220" y="0" width="100" height="28" rx="4" fill="#ca8a04" filter="url(#shadow)"/><text x="270" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Aggregate</text>
    <rect x="330" y="0" width="100" height="28" rx="4" fill="#7c3aed" filter="url(#shadow)"/><text x="380" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Policy/Rule</text>
    <rect x="440" y="0" width="80" height="28" rx="4" fill="#dc2626" filter="url(#shadow)"/><text x="480" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Hotspot</text>
    <rect x="530" y="0" width="80" height="28" rx="4" fill="#16a34a" filter="url(#shadow)"/><text x="570" y="18" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Read Model</text>
  </g>

  <!-- Flow Timeline Header -->
  <line x1="60" y1="125" x2="1340" y2="125" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
  <text x="60" y="118" fill="#38bdf8" font-size="12" font-weight="bold">LÍNEA DE TIEMPO DEL NEGOCIO (DESDE REGISTRO DE PARCELA HASTA GESTIÓN DE COSECHA Y COMUNIDAD)</text>

  <!-- Phase 1: Onboarding & Parcel Setup -->
  <rect x="30" y="145" width="250" height="640" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="45" y="172" fill="#38bdf8" font-size="14" font-weight="bold">1. Onboarding y Parcelas</text>
  
  <!-- Cards Phase 1 -->
  <!-- User Registered -->
  <g transform="translate(45, 195)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: RegisterUser</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Actor: Agricultor / Agrónomo</text>
  </g>
  <g transform="translate(45, 265)">
    <rect width="220" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: UserRegistered</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Perfil verificado y credenciales creadas</text>
  </g>
  <!-- Parcel Created -->
  <g transform="translate(45, 340)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: RegisterParcel</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Delimitar coordenadas GPS y tipo cultivo</text>
  </g>
  <g transform="translate(45, 410)">
    <rect width="220" height="60" rx="6" fill="#ca8a04" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Aggregate: Parcel</text>
    <text x="12" y="42" fill="#fef08a" font-size="10">ID, Geometría, Área, Cultivo, TipoSuelo</text>
  </g>
  <g transform="translate(45, 480)">
    <rect width="220" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: ParcelCreated</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Parcela habilitada para seguimiento</text>
  </g>
  <g transform="translate(45, 555)">
    <rect width="220" height="50" rx="6" fill="#16a34a" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Read Model: ParcelDashboardView</text>
    <text x="12" y="38" fill="#dcfce7" font-size="10">Mapa y estado de lotes activos</text>
  </g>
  <g transform="translate(45, 620)">
    <rect width="220" height="60" rx="6" fill="#dc2626" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Hotspot: Precisión GPS</text>
    <text x="12" y="38" fill="#fee2e2" font-size="10">Baja señal GPS en zonas rurales aisladas</text>
    <text x="12" y="52" fill="#fee2e2" font-size="9">Requiere soporte offline y dibujo manual</text>
  </g>

  <!-- Phase 2: Monitoring & Climate Tracking -->
  <rect x="300" y="145" width="255" height="640" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="315" y="172" fill="#38bdf8" font-size="14" font-weight="bold">2. Monitoreo y Clima</text>

  <g transform="translate(315, 195)">
    <rect width="225" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: FetchWeatherData</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Trigger: Cron / Ubicación de parcela</text>
  </g>
  <g transform="translate(315, 265)">
    <rect width="225" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: WeatherDataSynchronized</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Temp, Humedad, Viento, Pronóstico 7d</text>
  </g>
  <g transform="translate(315, 340)">
    <rect width="225" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: RecordSoilInspection</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Humedad manual, pH, textura y foto</text>
  </g>
  <g transform="translate(315, 410)">
    <rect width="225" height="60" rx="6" fill="#ca8a04" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Aggregate: SoilInspection</text>
    <text x="12" y="42" fill="#fef08a" font-size="10">ID, ParcelaID, Humedad, pH, Fecha</text>
  </g>
  <g transform="translate(315, 480)">
    <rect width="225" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: SoilInspectionRecorded</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Muestra almacenada local/remoto</text>
  </g>
  <g transform="translate(315, 555)">
    <rect width="225" height="50" rx="6" fill="#16a34a" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Read Model: SoilMoistureMapView</text>
    <text x="12" y="38" fill="#dcfce7" font-size="10">Historial y tendencias hídricas</text>
  </g>

  <!-- Phase 3: Analytics & Recommendations -->
  <rect x="575" y="145" width="255" height="640" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="590" y="172" fill="#38bdf8" font-size="14" font-weight="bold">3. Análisis y Diagnóstico</text>

  <g transform="translate(590, 195)">
    <rect width="225" height="60" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Policy: OnInspectionOrWeatherUpdate</text>
    <text x="12" y="42" fill="#f3e8ff" font-size="10">Evaluar requerimiento hídrico y plagas</text>
  </g>
  <g transform="translate(590, 265)">
    <rect width="225" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: GenerateCropReport</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Motor de reglas agronómicas</text>
  </g>
  <g transform="translate(590, 340)">
    <rect width="225" height="60" rx="6" fill="#ca8a04" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Aggregate: CropHealthReport</text>
    <text x="12" y="42" fill="#fef08a" font-size="10">ID, ScoreSalud, RiesgoPlaga, RiegoRec</text>
  </g>
  <g transform="translate(590, 410)">
    <rect width="225" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: CropReportGenerated</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Recomendaciones de riego y fertilizante</text>
  </g>
  <g transform="translate(590, 480)">
    <rect width="225" height="50" rx="6" fill="#16a34a" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Read Model: AgronomicSummaryView</text>
    <text x="12" y="38" fill="#dcfce7" font-size="10">Score de salud de cultivo y acciones</text>
  </g>
  <g transform="translate(590, 545)">
    <rect width="225" height="60" rx="6" fill="#dc2626" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Hotspot: Diagnóstico Sin Red</text>
    <text x="12" y="38" fill="#fee2e2" font-size="10">Cálculo local en app si no hay internet</text>
  </g>

  <!-- Phase 4: Alerts & Notifications -->
  <rect x="850" y="145" width="250" height="640" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="865" y="172" fill="#38bdf8" font-size="14" font-weight="bold">4. Alertas y Notificaciones</text>

  <g transform="translate(865, 195)">
    <rect width="220" height="60" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Policy: OnCriticalThresholdExceeded</text>
    <text x="12" y="42" fill="#f3e8ff" font-size="10">Helada inminente (&lt;2°C) o Sequía severa</text>
  </g>
  <g transform="translate(865, 265)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: DispatchAlertNotification</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Firebase Cloud Messaging (FCM)</text>
  </g>
  <g transform="translate(865, 340)">
    <rect width="220" height="60" rx="6" fill="#ca8a04" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Aggregate: AlertNotification</text>
    <text x="12" y="42" fill="#fef08a" font-size="10">ID, Nivel, Mensaje, Timestamp, Leído</text>
  </g>
  <g transform="translate(865, 410)">
    <rect width="220" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: AlertDispatched</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Push notification recibida en móvil</text>
  </g>
  <g transform="translate(865, 480)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: AcknowledgeAlert</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Confirmación de acción tomada</text>
  </g>
  <g transform="translate(865, 555)">
    <rect width="220" height="50" rx="6" fill="#16a34a" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Read Model: ActiveAlertsInbox</text>
    <text x="12" y="38" fill="#dcfce7" font-size="10">Bandeja de alertas prioritarias</text>
  </g>

  <!-- Phase 5: Community & Knowledge Sharing -->
  <rect x="1120" y="145" width="250" height="640" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-dasharray="4,4"/>
  <text x="1135" y="172" fill="#38bdf8" font-size="14" font-weight="bold">5. Comunidad y Foro</text>

  <g transform="translate(1135, 195)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: CreateForumPost</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Consulta plaga o experiencia cultivo</text>
  </g>
  <g transform="translate(1135, 265)">
    <rect width="220" height="60" rx="6" fill="#ca8a04" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Aggregate: ForumPost</text>
    <text x="12" y="42" fill="#fef08a" font-size="10">ID, AutorID, Título, Categoría, Votos</text>
  </g>
  <g transform="translate(1135, 340)">
    <rect width="220" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: ForumPostPublished</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Visible para agrónomos y agricultores</text>
  </g>
  <g transform="translate(1135, 410)">
    <rect width="220" height="60" rx="6" fill="#0284c7" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Command: SubmitAgronomistAdvice</text>
    <text x="12" y="42" fill="#e0f2fe" font-size="10">Respuesta técnica validada</text>
  </g>
  <g transform="translate(1135, 480)">
    <rect width="220" height="60" rx="6" fill="#f97316" filter="url(#shadow)"/>
    <text x="12" y="24" fill="#ffffff" font-size="11" font-weight="bold">Event: AdviceAccepted</text>
    <text x="12" y="42" fill="#ffedd5" font-size="10">Aumento de reputación de agrónomo</text>
  </g>
  <g transform="translate(1135, 555)">
    <rect width="220" height="50" rx="6" fill="#16a34a" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Read Model: CommunityFeedView</text>
    <text x="12" y="38" fill="#dcfce7" font-size="10">Muro comunitario y mejores prácticas</text>
  </g>
  <g transform="translate(1135, 620)">
    <rect width="220" height="60" rx="6" fill="#ec4899" filter="url(#shadow)"/>
    <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="bold">Opportunity: Red de Expertos</text>
    <text x="12" y="38" fill="#fce7f3" font-size="10">Conectar pequeños productores con</text>
    <text x="12" y="52" fill="#fce7f3" font-size="9">especialistas certificados del MINAGRI</text>
  </g>
</svg>
